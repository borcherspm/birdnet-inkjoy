version: '3.8'

services:
  # ============================================================================
  # BirdNET-Go: Local AI Audio Analysis of Camera RTSP Stream
  # ============================================================================
  birdnet-go:
    image: ghcr.io/tphakala/birdnet-go:latest
    container_name: birdnet-go
    restart: unless-stopped
    ports:
      - "${BIRDNET_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-UTC}
      BIRDNET_UID: "${PUID:-1000}"
      BIRDNET_GID: "${PGID:-1000}"
      BIRDNET_HOST: ${BIRDNET_HOSTNAME:-birdnet.local}
    volumes:
      - ./data/birdnet-go/config:/config
      - ./data/birdnet-go/data:/data
    tmpfs:
      # Spectrograms of recent detections (RAM disk for speed and SSD longevity)
      - /config/hls:size=50m,uid=1000,gid=1000
    networks:
      - birdnet-net

  # ============================================================================
  # Tesserae: E-Ink Dashboard & Natural History Plate Companion
  # ============================================================================
  tesserae:
    image: ghcr.io/dmellok/tesserae:latest
    container_name: tesserae
    restart: unless-stopped
    ports:
      - "${TESSERAE_PORT:-8765}:8765"
    environment:
      TESSERAE_IN_DOCKER: "1"
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/tesserae/data:/app/data
    networks:
      - birdnet-net

  # ============================================================================
  # Saezuri: Web Collage & Species Gallery for BirdNET-Go
  # ============================================================================
  saezuri:
    image: ghcr.io/vrwrts/saezuri:latest
    container_name: saezuri
    restart: unless-stopped
    ports:
      - "${SAEZURI_PORT:-8090}:8080"
    environment:
      BIRDNETGO_URL: http://birdnet-go:8080
      SPECIES_DICT_LOCALES: ${LOCALE:-en}
      BIRDNETGO_TOKEN: ${BIRDNETGO_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data/saezuri/illustrations:/data/illustrations
      - ./data/saezuri/calls:/data/calls
    depends_on:
      - birdnet-go
    networks:
      - birdnet-net

  # ============================================================================
  # Optional Local Mosquitto MQTT Broker (if you don't run an external MQTT broker)
  # Run with: docker compose --profile with-mqtt up -d
  # ============================================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    profiles: ["with-mqtt"]
    ports:
      - "${MOSQUITTO_PORT:-1883}:1883"
    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    networks:
      - birdnet-net

networks:
  birdnet-net:
    name: birdnet-net
    driver: bridge
