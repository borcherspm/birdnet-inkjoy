# Automation: Push BirdNET-Go Artwork to InkJoy Muse Frame
#
# Runs every 15 minutes between 7:00 AM and 6:00 PM (daylight birding hours).
#
# Smart Hash Deduplication:
# The inkjoy_bridge.py script checks a visual SHA-256 hash of the rendered image.
# If no new birds were detected and nothing visual has moved in the last 15 minutes,
# it automatically aborts the upload, preserving your frame's battery life.

alias: "Birds: 15-Minute Day Check"
description: "Pushes fresh bird artwork to InkJoy frame every 15 minutes during daylight hours"
trigger:
  - platform: time_pattern
    minutes: "/15"
condition:
  - condition: time
    after: "07:00:00"
    before: "18:00:00"
action:
  - action: shell_command.push_bird_to_inkjoy
mode: single
